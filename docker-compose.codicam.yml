services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-pad}
    volumes:
      - ${DATA_DIR:-/srv/appdata/alcove}/postgres:/var/lib/postgresql/data
      - ${BACKUP_DIR:-/srv/backups/alcove}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    networks: [backend]

  keycloak-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
    volumes:
      - ${DATA_DIR:-/srv/appdata/alcove}/keycloak-postgres:/var/lib/postgresql/data
      - ${BACKUP_DIR:-/srv/backups/alcove}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    networks: [backend]

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - ${DATA_DIR:-/srv/appdata/alcove}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    networks: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start", "--http-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      KC_HOSTNAME: ${OIDC_SERVER_URL:?required}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    networks: [backend]

  ollama:
    image: ollama/ollama:0.11.7
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-8}
    volumes:
      - ${DATA_DIR:-/srv/appdata/alcove}/ollama:/root/.ollama
    restart: unless-stopped
    mem_limit: 16g
    cpus: 10
    networks: [backend]

  pad:
    image: ${ALCOVE_IMAGE:-ghcr.io/korokira/alcove:main}
    environment:
      PAD_DEV_MODE: "false"
      STATIC_DIR: /app/frontend/dist
      ASSETS_DIR: /app/frontend/dist/assets
      FRONTEND_URL: ${FRONTEND_URL:?required}
      ALLOWED_ORIGINS: ${FRONTEND_URL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-pad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pad}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      OIDC_SERVER_URL: ${OIDC_SERVER_URL}
      OIDC_INTERNAL_URL: http://keycloak:8080
      OIDC_REALM: ${OIDC_REALM:-alcove}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-alcove}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?required}
      REDIRECT_URI: ${FRONTEND_URL}/api/auth/callback
      OLLAMA_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2}
      AI_RATE_PER_MINUTE: ${AI_RATE_PER_MINUTE:-12}
      AI_DAILY_QUOTA: ${AI_DAILY_QUOTA:-200}
      AI_GLOBAL_CONCURRENCY: ${AI_GLOBAL_CONCURRENCY:-2}
      AI_USER_CONCURRENCY: ${AI_USER_CONCURRENCY:-1}
      AI_QUEUE_TIMEOUT_SECONDS: ${AI_QUEUE_TIMEOUT_SECONDS:-20}
      AI_UPSTREAM_TIMEOUT_SECONDS: ${AI_UPSTREAM_TIMEOUT_SECONDS:-180}
      AI_MAX_REQUEST_BYTES: ${AI_MAX_REQUEST_BYTES:-262144}
      AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-120000}
      AI_MAX_EMBED_CHARS: ${AI_MAX_EMBED_CHARS:-16000}
      SYNC_DIR: /data/pads
      API_WORKERS: ${API_WORKERS:-2}
    volumes:
      - ${DATA_DIR:-/srv/appdata/alcove}/pads:/data/pads
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4
    networks: [backend]

networks:
  backend:
    driver: bridge
