# docker-compose.selfhost.yml — private single-user deployment; no authentication.
#
# Design:
#   * No Keycloak, no Coder — one user, PAD_DEV_MODE=true.
#   * No Ollama service — the app proxies to OLLAMA_URL on this server.
#   * pad publishes only on the loopback (127.0.0.1:8000); Tailscale serves it in HTTPS
#     over the tailnet, so nothing is exposed to the LAN or the public internet.
#   * Persistent data lives under ${DATA_DIR}. Configure and test a backup separately.
#
# This is for a trusted private tailnet only: every visitor shares the same user.
# Use docker-compose.codicam.yml for authenticated or public hosting (SETUP.md).
# Deploy:
#   1. git clone <repo> /srv/docker/alcove && cd /srv/docker/alcove
#   2. cp .env.selfhost.example .env  and edit POSTGRES_PASSWORD + FRONTEND_URL
#   3. docker compose -f docker-compose.selfhost.yml up -d --build
#   4. sudo tailscale serve --bg --https=443 / http://localhost:8000

services:
  postgres:
    image: postgres:16
    container_name: alcove-postgres
    environment:
      POSTGRES_USER: pad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pad
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pad-network

  redis:
    image: redis:alpine
    container_name: alcove-redis
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - pad-network

  pad:
    # CI publishes revision tags. Pull a pinned ALCOVE_IMAGE for repeatable updates;
    # use --build explicitly when testing source changes on your own machine.
    build: .
    image: ${ALCOVE_IMAGE:-ghcr.io/korokira/alcove:main}
    container_name: alcove-pad
    environment:
      - PAD_DEV_MODE=true
      # Required for the isolated container interface; the host port stays loopback-only.
      - PAD_DEV_HOST=0.0.0.0
      - PAD_DEV_ALLOW_DANGEROUS_BIND=true
      - STATIC_DIR=/app/frontend/dist
      - ASSETS_DIR=/app/frontend/dist/assets
      - FRONTEND_URL=${FRONTEND_URL}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=pad
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=pad
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SYNC_DIR=/data/pads
      - API_WORKERS=1
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-llama3.2}
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_DIR:-./data}/pads:/data/pads
    ports:
      # Loopback only — Tailscale is the ingress. Nothing on eth0.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - pad-network

networks:
  pad-network:
    driver: bridge
