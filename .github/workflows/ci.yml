name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        working-directory: src/backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: src/backend
        run: python -m pytest tests/ -v

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        working-directory: src/backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Create isolated migration databases
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE alcove_fresh" \
            -c "CREATE DATABASE alcove_existing"

      - name: Verify fresh database bootstrap and Alembic drift
        env:
          POSTGRES_DB: alcove_fresh
          DB_BOOTSTRAP_FRESH: "true"
        run: ./scripts/db-migrate.sh

      - name: Verify existing database upgrade and backfill
        working-directory: src/backend
        env:
          POSTGRES_DB: alcove_existing
          ALLOW_TEST_DB_RESET: "true"
        run: |
          python ../../scripts/prepare-existing-db.py
          alembic upgrade head
          alembic check
          python ../../scripts/verify-existing-backfill.py

      - name: Run PostgreSQL and Redis integration tests
        working-directory: src/backend
        env:
          POSTGRES_DB: alcove_existing
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/alcove_existing
          ALCOVE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/alcove_existing
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: PYTHONPATH=. python -m pytest tests/ -m integration -v

      - name: Verify a backup can be restored in isolation
        run: |
          # Dump AND restore with the clients of the postgres:16 image so their
          # major version matches the PostgreSQL 16 service: a newer pg_dump or
          # pg_restore emits settings (transaction_timeout) PostgreSQL 16 rejects.
          mkdir -p "$RUNNER_TEMP/backup"
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            pg_dump -Fc --no-owner --no-acl -h 127.0.0.1 -U postgres alcove_existing > "$RUNNER_TEMP/backup/alcove.dump"
          (cd "$RUNNER_TEMP/backup" && sha256sum alcove.dump > SHA256SUMS)
          docker run --rm --network host \
            -e VERIFY_PG_HOST=127.0.0.1 -e VERIFY_PG_PASSWORD=postgres \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" -v "$RUNNER_TEMP/backup:/backup:ro" \
            postgres:16 sh /scripts/verify-restore.sh /backup

      - name: Verify migration rollback and re-upgrade
        working-directory: src/backend
        env:
          POSTGRES_DB: alcove_existing
          ALLOW_TEST_DB_RESET: "true"
        run: |
          alembic downgrade c8d1f2a3b4e5
          alembic upgrade head
          python ../../scripts/verify-existing-backfill.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: src/frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn typecheck
      - name: Unit tests
        run: yarn test
      - name: Build
        run: yarn build

  dependency-audit:
    runs-on: ubuntu-latest
    # Advisory databases change daily: report, do not block unrelated PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r src/backend/requirements.txt
      - name: Frontend production dependencies
        working-directory: src/frontend
        run: yarn audit --groups dependencies --level high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
