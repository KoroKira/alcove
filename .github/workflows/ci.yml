name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        working-directory: src/backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: src/backend
        run: python -m pytest tests/ -v

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        working-directory: src/backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Create isolated migration databases
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE alcove_fresh" \
            -c "CREATE DATABASE alcove_existing"

      - name: Verify fresh database bootstrap and Alembic drift
        env:
          POSTGRES_DB: alcove_fresh
          DB_BOOTSTRAP_FRESH: "true"
        run: ./scripts/db-migrate.sh

      - name: Verify existing database upgrade and backfill
        working-directory: src/backend
        env:
          POSTGRES_DB: alcove_existing
          ALLOW_TEST_DB_RESET: "true"
        run: |
          python ../../scripts/prepare-existing-db.py
          alembic upgrade head
          alembic check
          python ../../scripts/verify-existing-backfill.py

      - name: Run PostgreSQL and Redis integration tests
        working-directory: src/backend
        env:
          POSTGRES_DB: alcove_existing
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/alcove_existing
          ALCOVE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/alcove_existing
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: PYTHONPATH=. python -m pytest tests/ -m integration -v

      - name: Verify migration rollback and re-upgrade
        working-directory: src/backend
        env:
          POSTGRES_DB: alcove_existing
          ALLOW_TEST_DB_RESET: "true"
        run: |
          alembic downgrade c8d1f2a3b4e5
          alembic upgrade head
          python ../../scripts/verify-existing-backfill.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
