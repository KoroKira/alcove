version: '3.8'

# Bridge networking so this works on macOS Docker Desktop (host networking is Linux-only).
# Services communicate via service names on the pad-network.
# Keycloak is reached from containers via extra_hosts "keycloak-host" → Docker host,
# so the public issuer URL (http://localhost:8080) matches what Coder receives in JWTs.

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    networks:
      - pad-network

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    networks:
      - pad-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: start
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_URL: http://localhost:${KEYCLOAK_PORT}
      KC_HOSTNAME_ADMIN_URL: http://localhost:${KEYCLOAK_PORT}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY: "edge"
      PROXY_ADDRESS_FORWARDING: "true"
      KC_DB: postgres
      # Use service name (bridge network)
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - pad-network

  coder:
    image: ghcr.io/coder/coder:latest
    container_name: coder
    environment:
      CODER_ACCESS_URL: http://localhost:${CODER_PORT}
      # Must match the issuer in Keycloak-issued JWTs (http://localhost:…).
      # extra_hosts routes "localhost" → Docker host so this container can reach Keycloak.
      CODER_OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT}/realms/${OIDC_REALM}
      CODER_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      CODER_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      CODER_OIDC_SIGN_IN_TEXT: "Sign in for pad"
      CODER_ADDITIONAL_CSP_POLICY: ${CODER_ADDITIONAL_CSP_POLICY}
      CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLED: "false"
      CODER_PG_CONNECTION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      CODER_ADDRESS: 0.0.0.0:7080
      CODER_OIDC_IGNORE_EMAIL_VERIFIED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${CODER_PORT:-7080}:7080"
    restart: unless-stopped
    depends_on:
      - postgres
      - keycloak
    # Routes "localhost" inside this container to the Docker host, so that
    # http://localhost:8080 reaches the Keycloak port exposed on the host.
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - pad-network

  pad:
    build: .
    image: alcove:local
    container_name: pad
    environment:
      - STATIC_DIR=/app/frontend/dist
      - ASSETS_DIR=/app/frontend/dist/assets
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      # Public URL (used to build browser redirect URLs)
      - OIDC_SERVER_URL=http://localhost:${KEYCLOAK_PORT}
      # Internal URL (used for server-side token exchange and JWKS)
      - OIDC_INTERNAL_URL=http://keycloak:${KEYCLOAK_PORT}
      - OIDC_REALM=${OIDC_REALM}
      - REDIRECT_URI=${REDIRECT_URI}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CODER_API_KEY=${CODER_API_KEY}
      - CODER_URL=http://coder:${CODER_PORT}
      - CODER_TEMPLATE_ID=${CODER_TEMPLATE_ID}
      - CODER_DEFAULT_ORGANIZATION=${CODER_DEFAULT_ORGANIZATION}
      - API_WORKERS=${API_WORKERS}
      - FRONTEND_URL=${FRONTEND_URL}
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - keycloak
    networks:
      - pad-network

networks:
  pad-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
