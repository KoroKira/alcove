# docker-compose.friends.yml — the simple way to run Alcove: no Keycloak, no Coder,
# no local Python/Node install. Just Docker.
#
#   docker compose -f docker-compose.friends.yml up -d --build
#
# Then open http://localhost:8000 — auto-logged in as local@localhost, single user.
# Everything (app, database, cache, AI model) lives in containers; nothing is
# installed on the host except Docker itself.
#
# Only port 8000 is published to the host — Postgres/Redis/Ollama stay internal
# to the pad-network bridge, so this won't collide with anything already running
# on a friend's machine (e.g. a native Ollama install on 11434).

services:
  postgres:
    image: postgres:16
    container_name: alcove-friends-postgres
    environment:
      POSTGRES_USER: pad
      POSTGRES_PASSWORD: padlocal
      POSTGRES_DB: pad
    volumes:
      - alcove_friends_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pad-network

  redis:
    image: redis:alpine
    container_name: alcove-friends-redis
    volumes:
      - alcove_friends_redis_data:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - pad-network

  ollama:
    image: ollama/ollama:latest
    container_name: alcove-friends-ollama
    volumes:
      - alcove_friends_ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - pad-network

  # One-shot: pulls the default model into the ollama volume, then exits.
  # Re-running `up` is a no-op once the model is already pulled.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: alcove-friends-ollama-pull
    entrypoint:
      - /bin/sh
      - -c
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull llama3.2
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      - ollama
    restart: "no"
    networks:
      - pad-network

  pad:
    build: .
    image: alcove:friends
    container_name: alcove-friends-pad
    environment:
      - PAD_DEV_MODE=true
      - STATIC_DIR=/app/frontend/dist
      - ASSETS_DIR=/app/frontend/dist/assets
      - FRONTEND_URL=http://localhost:8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=pad
      - POSTGRES_PASSWORD=padlocal
      - POSTGRES_DB=pad
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_DEFAULT_MODEL=llama3.2
      - SYNC_DIR=/data/pads
      - API_WORKERS=1
    volumes:
      - ./pads:/data/pads
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - ollama
    networks:
      - pad-network

networks:
  pad-network:
    driver: bridge

volumes:
  alcove_friends_postgres_data:
  alcove_friends_redis_data:
  alcove_friends_ollama_data:
